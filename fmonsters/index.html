<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>フィギュアモンスターズ Ver0.6</title>

<style>
body{
    margin:0;
    background:#1b1b2f;
    color:white;
    font-family:sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.game{

    width:95%;
    max-width:400px;

}

h1{
    text-align:center;

    font-size:clamp(
        14px,
        6vw,
        40px
    );

    white-space:nowrap;
}

.monster{
    text-align:center;
    font-size:150px;
}

.bar{
    height:20px;
    background:#444;
    border-radius:10px;
    overflow:hidden;
    margin-bottom:10px;
}

.fill{
    height:100%;
    background:limegreen;
}

button{

    margin:0;

    padding:10px;

    width:100%;

    font-size:15px;
}
.button-grid{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:8px;

    margin-top:10px;
}

.feed{
    background:#f6b93b;
}

.train{
    background:#60a3bc;
}

.evolve{
    background:#d980fa;
}

.save{
    background:#78e08f;
}

.reset{
    background:#eb2f06;
    color:white;
}

input{
    width:100%;
    padding:8px;
    margin-bottom:10px;
    border-radius:8px;
    border:none;
    box-sizing:border-box;
}

.log{
    margin-top:10px;
    background:#111;
    padding:10px;
    border-radius:10px;
    min-height:50px;
}

.dex{
    margin-top:15px;
    background:#181818;
    border-radius:10px;
    padding:10px;
}

.dex-item{
    padding:5px;
}
.monster-card{

    margin-top:15px;

    padding:20px;

    border-radius:20px;

    min-height:220px;
}
.fire{
    background:linear-gradient(135deg,#ff512f,#dd2476);
}

.water{
    background:linear-gradient(135deg,#2193b0,#6dd5ed);
}

.thunder{
    background:linear-gradient(135deg,#f7971e,#ffd200);
    color:black;
}

.nature{
    background:linear-gradient(135deg,#56ab2f,#a8e063);
    color:black;
}

.dark{
    background:linear-gradient(135deg,#41295a,#2f0743);
}
.rarity{

    font-size:20px;
    font-weight:bold;

    margin:10px 0;
}
.ssr{
    color:#ffd700;
    text-shadow:0 0 10px gold;
}

.sr{
    color:#ff66ff;
}

.r{
    color:#66ccff;
}

.n{
    color:#ffffff;
}



#monsterImage{

    width:100%;
    max-width:450px;

    display:block;
    margin:auto;

    border-radius:15px;

    object-fit:contain;
}
#imageModal{

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background:
    rgba(0,0,0,0.95);

    display:none;

    justify-content:center;
    align-items:center;

    z-index:9999;
}

#fullMonsterImage{

    max-width:95%;
    max-height:95%;

    border-radius:15px;
}
.floating{

    animation:
    floating 4s ease-in-out infinite;
}

@keyframes floating{

    0%{
        transform:
        translateY(0px);
    }

    50%{
        transform:
        translateY(-10px);
    }

    100%{
        transform:
        translateY(0px);
    }
}

.glowAura{

    filter:
    drop-shadow(
        0 0 20px gold
    );
}
.fireGlow{
    filter:
    drop-shadow(0 0 20px #ff4500)
    drop-shadow(0 0 40px #ff8800);
}

.waterGlow{
    filter:
    drop-shadow(0 0 20px #00bfff)
    drop-shadow(0 0 40px #00ffff);
}

.thunderGlow{
    filter:
    drop-shadow(0 0 20px #ffff00)
    drop-shadow(0 0 40px #ffd700);
}

.natureGlow{
    filter:
    drop-shadow(0 0 20px #00ff66)
    drop-shadow(0 0 40px #66ff99);
}

.darkGlow{
    filter:
    drop-shadow(0 0 20px #aa00ff)
    drop-shadow(0 0 40px #ff00ff);
}
.magicCircle{

    position:relative;
}
.sparkle{
    animation:sparkle 1.5s infinite;
}

@keyframes sparkle{
    0%{
        filter:
        drop-shadow(0 0 5px #00bfff);
    }

    50%{
        filter:
        drop-shadow(0 0 20px #00bfff)
        drop-shadow(0 0 40px #00ffff)
        drop-shadow(0 0 60px #0088ff);
    }

    100%{
        filter:
        drop-shadow(0 0 5px #00bfff);
    }
}
.fireAura{
    animation: fireSparkle 1.5s infinite;
}

@keyframes fireSparkle{
    0%{
        filter:
        drop-shadow(0 0 3px #ff4500);
    }

    50%{
        filter:
        drop-shadow(0 0 5px #ff4500)
        drop-shadow(0 0 5px #ff8800)
        drop-shadow(0 0 5px red);
    }

    100%{
        filter:
        drop-shadow(0 0 3px #ff4500);
    }
}

@keyframes waterSparkle{
    0%{
        filter:
        drop-shadow(0 0 3px #00bfff);
    }

    50%{
        filter:
        drop-shadow(0 0 5px #00bfff)
        drop-shadow(0 0 5px #00ffff)
        drop-shadow(0 0 5px #0088ff);
    }

    100%{
        filter:
        drop-shadow(0 0 3px #00bfff);
    }
}

@keyframes thunderSparkle{
    0%{
        filter:
        drop-shadow(0 0 3px yellow);
    }

    50%{
        filter:
        drop-shadow(0 0 5px yellow)
        drop-shadow(0 0 5px gold)
        drop-shadow(0 0 5px orange);
    }

    100%{
        filter:
        drop-shadow(0 0 3px yellow);
    }
}

.natureAura{
    animation: natureSparkle 1.5s infinite;
}

@keyframes natureSparkle{
    0%{
        filter:
        drop-shadow(0 0 5px #00ff66);
    }

    50%{
        filter:
        drop-shadow(0 0 5px #00ff66)
        drop-shadow(0 0 5px #66ff99)
        drop-shadow(0 0 5px #00cc44);
    }

    100%{
        filter:
        drop-shadow(0 0 5px #00ff66);
    }
}
.darkAura{
    animation: darkSparkle 1.5s infinite;
}

@keyframes darkSparkle{
    0%{
        filter:
        drop-shadow(0 0 5px #aa00ff);
    }

    50%{
        filter:
        drop-shadow(0 0 5px #aa00ff)
        drop-shadow(0 0 5px #ff00ff)
        drop-shadow(0 0 5px #6600cc);
    }

    100%{
        filter:
        drop-shadow(0 0 5px #aa00ff);
    }
}
.rainbowGlow{
    animation: rainbowAura 2s linear infinite;
}

@keyframes rainbowAura{
    0%{
        filter:
        drop-shadow(0 0 20px red)
        drop-shadow(0 0 40px orange);
    }

    20%{
        filter:
        drop-shadow(0 0 20px yellow)
        drop-shadow(0 0 40px lime);
    }

    40%{
        filter:
        drop-shadow(0 0 20px cyan)
        drop-shadow(0 0 40px blue);
    }

    60%{
        filter:
        drop-shadow(0 0 20px violet)
        drop-shadow(0 0 40px magenta);
    }

    80%{
        filter:
        drop-shadow(0 0 20px pink)
        drop-shadow(0 0 40px gold);
    }

    100%{
        filter:
        drop-shadow(0 0 20px red)
        drop-shadow(0 0 40px orange);
    }
}
@keyframes rotateCircle{

    from{
        transform:
        rotate(0deg);
    }

    to{
        transform:
        rotate(360deg);
    }
}

.fireCircle::before{
    background:
    radial-gradient(
        circle,
        rgba(255,80,0,.4),
        transparent 70%
    );
}

.waterCircle::before{
    background:
    radial-gradient(
        circle,
        rgba(0,180,255,.4),
        transparent 70%
    );
}

.thunderCircle::before{
    background:
    radial-gradient(
        circle,
        rgba(255,255,0,.4),
        transparent 70%
    );
}

.natureCircle::before{
    background:
    radial-gradient(
        circle,
        rgba(0,255,100,.4),
        transparent 70%
    );
}

.darkCircle::before{
    background:
    radial-gradient(
        circle,
        rgba(180,0,255,.4),
        transparent 70%
    );
}
#monsterNameOverlay{
    position:absolute;
    top:15px;
    left:15px;
    z-index:10;

    padding:8px 14px;

    background:rgba(0,0,0,0.5);
    border-radius:12px;

    color:white;
    font-size:24px;
    font-weight:bold;

    text-shadow:
        0 0 8px #000,
        0 0 15px #000;
}

.monster-container{
    position:relative;
}

.monster-name{
    position:absolute;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    z-index:999;

    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;

    width:90%;
    max-width:420px;

    color:white;
    font-weight:bold;

    background:rgba(0,0,0,.5);
    padding:6px 12px;
    border-radius:10px;

    overflow:hidden;
}

#displayName{
    font-family:"Yu Mincho",serif;
    font-weight:900;

    font-size:24px;

    white-space:nowrap;

    flex:1;
    text-align:center;
}
#species{
    display:none;
}
#nameLevel{
    color:#ffd700;
    font-size:20px;
    font-weight:900;
}
.legendSparkle{
    animation: legendSparkle 1.5s infinite;
}

@keyframes legendSparkle{
    0%{
        filter:
        brightness(1)
        drop-shadow(0 0 5px white);
    }

    50%{
        filter:
        brightness(1.3)
        drop-shadow(0 0 15px white)
        drop-shadow(0 0 30px gold);nanimo 
    }

    100%{
        filter:
        brightness(1)
        drop-shadow(0 0 5px white);
    }
}

</style>

</head>

${completedBranches.includes("fire") ? "✅" : "⬜"} 火<br>
${completedBranches.includes("water") ? "✅" : "⬜"} 水<br>
${completedBranches.includes("thunder") ? "✅" : "⬜"} 雷<br>
${completedBranches.includes("nature") ? "✅" : "⬜"} 自然<br>
${completedBranches.includes("dark") ? "✅" : "⬜"} 闇
`;
renderDex();
}

function log(text){
document.getElementById("log").innerText = text;
}

function feed(){

hunger += 10;

if(hunger > 100){
hunger = 100;
}

log("ごはんを食べた！");
saveGame();
updateUI();
}

function train(){

    hunger = 100;

    exp = 0;

    level += 5;

    awakeningStone += 10;

    rarity = "★★★★★ SSR";

    log(
        "デバッグモード Lv" +
        level
    );

    evolve();

    saveGame();
    updateUI();
}
function awaken(){

    if(rarity === "★★★★★ SSR"){

        log("すでにSSRです！");
        return;
    }

    if(awakeningStone < 5){

        log("覚醒石が足りません！");
        return;
    }

    awakeningStone -= 5;

    if(rarity === "★★ N"){

        rarity = "★★★ R";
    }
    else if(rarity === "★★★ R"){

        rarity = "★★★★ SR";
    }
    else if(rarity === "★★★★ SR"){

        rarity = "★★★★★ SSR";
    }

    log("💎 覚醒成功！");

    updateMonsterCard();

    saveGame();
    updateUI();
}
function rebirth(){

    if(stage < 20){

        log(
            "神話モンスターでのみ転生できます！"
        );

        return;
    }

    document.getElementById(
        "rebirthSelect"
    ).style.display = "block";

}


function selectBranch(type){

    nextBranch = type;

    rebirthPoint++;

    level = 1;
    exp = 0;
    hunger = 50;

    stage = 0;

    rarity = "★★ N";

    const types = [

    "パワー型",
    "スピード型",
    "防御型",
    "回復型"

];

buildType =

types[
    Math.floor(
        Math.random() *
        types.length
    )
];

    if(type === "fire"){

        element = "🔥 火";
        branch = "fire";
    }
    else if(type === "water"){

        element = "💧 水";
        branch = "water";
    }
    else if(type === "thunder"){

        element = "⚡ 雷";
        branch = "thunder";
    }
    else if(type === "nature"){

        element = "🌿 自然";
        branch = "nature";
    }
    else if(type === "dark"){

        element = "🌙 闇";
        branch = "dark";
    }


    document.getElementById(
        "rebirthSelect"
    ).style.display = "none";

    updateMonsterCard();

    log(
        "🔄 転生完了！"
    );

    saveGame();
    updateUI();
}
function evolveWithEffect(
    newStage,
    message
){

    const monster =
    document.getElementById(
    "monsterImage"
);

    monster.classList.add(
        "evolving"
    );

    log("✨✨✨進化中...✨✨✨");

    setTimeout(() => {

        stage = newStage;

        unlockMonster(newStage);

        monster.classList.remove(
            "evolving"
        );

        log(message);
if(newStage >= 20){

    if(
        !completedBranches.includes(
            branch
        )
    ){

        completedBranches.push(
            branch
        );
    }

}

        saveGame();

        updateUI();

    }, 2000);

}
function evolve(){

    const normalEvolution =
    evolutionTable.find(e =>

        e.from === stage &&
        level >= e.level

    );

    if(normalEvolution){

        evolveWithEffect(
            normalEvolution.to,
            normalEvolution.text
        );

        return;
    }

    const branchTable =
    branchEvolutionTable[branch];

    if(!branchTable){

        return;
    }

    const branchEvolution =
    branchTable.find(e => {

        if(e.from !== stage){

            return false;
        }

        if(level < e.level){

            return false;
        }

        if(
            e.rarity &&
            rarity !== e.rarity
        ){

            return false;
        }

        return true;

    });

    if(!branchEvolution){

        return;
    }

    evolveWithEffect(

        branchEvolution.to,

        branchEvolution.text

    );

}


function unlockMonster(id){

if(!dex.includes(id)){
dex.push(id);
}
}

function renderDex(){

let html = "";

dex.forEach(id => {

html += `
<div class="dex-item">
${monsters[id].emoji}
${monsters[id].name}
</div>
`;

});

if(html === ""){
html = "未発見";
}

document.getElementById("dexList").innerHTML =
html;
}

function saveGame(){

const saveData = {

level,
exp,
hunger,
awakeningStone,
rebirthPoint,
completedBranches,
stage,
dex,


nickname:
document.getElementById("nickname").value,

element,
rarity,
branch,
nextBranch,
lastPlayed: Date.now()

};
localStorage.setItem(
"figureMonsterSave",
JSON.stringify(saveData)
);
}

function loadGame(){

    const raw =
    localStorage.getItem(
        "figureMonsterSave"
    );

if(!raw){

    unlockMonster(0);

    const branches = [
        "fire",
        "water",
        "thunder",
        "nature",
        "dark"
    ];

    branch =
    branches[
        Math.floor(
            Math.random() *
            branches.length
        )
    ];

    if(branch === "fire"){
        element = "🔥 火";
    }
    else if(branch === "water"){
        element = "💧 水";
    }
    else if(branch === "thunder"){
        element = "⚡ 雷";
    }
    else if(branch === "nature"){
        element = "🌿 自然";
    }
    else if(branch === "dark"){
        element = "🌙 闇";
    }

    saveGame();

    return;
}


const data =
JSON.parse(raw);

rarity =
data.rarity || "";

branch =
data.branch || "";
nextBranch =
data.nextBranch || "";
level = data.level;
exp = data.exp;
hunger = data.hunger;
awakeningStone =
data.awakeningStone || 0;

rebirthPoint =
data.rebirthPoint || 0;
completedBranches =
data.completedBranches || [];

stage = data.stage;
dex = data.dex || [0];

const now = Date.now();

const minutes =
Math.floor(
(now - data.lastPlayed) /
60000
);

hunger -= minutes;

if(hunger < 0){

    hunger = 0;
}

document.getElementById("nickname").value =
data.nickname || "";
element =
data.element || "";


if(element){

    updateMonsterCard();
}


log("セーブデータを読み込みました");
}

function resetGame(){

if(confirm("データを削除しますか？")){

localStorage.removeItem(
"figureMonsterSave"
);

location.reload();
}
}
function updateMonsterCard(){

    const card =
    document.getElementById("monsterCard");

    card.style.display = "block";

    card.className = "monster-card";

    document.getElementById("cardTitle")
    .innerText =
    document.getElementById("nickname").value ||
    "名無しモンスター";

    document.getElementById("cardElement")
    .innerText = element;

    document.getElementById("cardType")
    .innerText = buildType;

    document.getElementById("cardRarity")
    .innerText = rarity;

    if(element.includes("火")){

        card.classList.add("fire");

    }else if(element.includes("水")){

        card.classList.add("water");

    }else if(element.includes("雷")){

        card.classList.add("thunder");

    }else if(element.includes("自然")){

        card.classList.add("nature");

    }else if(element.includes("闇")){

        card.classList.add("dark");
    }

    const rarityLabel =
    document.getElementById("cardRarity");

    rarityLabel.className = "rarity";

   if(rarity === "★★★★★ SSR"){

    rarityLabel.classList.add("ssr");

}
else if(rarity === "★★★★ SR"){

    rarityLabel.classList.add("sr");

}
else if(rarity === "★★★ R"){

    rarityLabel.classList.add("r");

}
else{

    rarityLabel.classList.add("n");

}

}
function rarityUpgrade(){

    const roll = Math.random();

    if(rarity === "★★ N"){

        if(roll < 0.6){

            rarity = "★★★ R";

            log("🌟 N → R に昇格！");
        }
    }

    else if(rarity === "★★★ R"){

        if(roll < 0.4){

            rarity = "★★★★ SR";

            log("✨ R → SR に昇格！");
        }
    }

    else if(rarity === "★★★★ SR"){

        if(roll < 0.05){

            rarity = "★★★★★ SSR";

            log("👑 SR → SSR に昇格！");
        }
    }

    updateMonsterCard();
}

.getElementById("nickname")
.addEventListener("input",()=>{

saveGame();
updateUI();

});

setInterval(() => {

    hunger--;

    if(hunger < 0){

        hunger = 0;
    }

    saveGame();
    updateUI();

}, 60000);

.getElementById(

updateUI();
