<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>フィギュアモンスターズ Ver0.5</title>

<style>
body{
    margin:0;
    background:#1b1b2f;
    color:white;
    font-family:sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.game{

    width:95%;
    max-width:400px;

}

h1{
    text-align:center;
}

.monster{
    text-align:center;
    font-size:150px;
}

.bar{
    height:20px;
    background:#444;
    border-radius:10px;
    overflow:hidden;
    margin-bottom:10px;
}

.fill{
    height:100%;
    background:limegreen;
}

button{

    margin:0;

    padding:10px;

    width:100%;

    font-size:15px;
}
.button-grid{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:8px;

    margin-top:10px;
}

.feed{
    background:#f6b93b;
}

.train{
    background:#60a3bc;
}

.evolve{
    background:#d980fa;
}

.save{
    background:#78e08f;
}

.reset{
    background:#eb2f06;
    color:white;
}

input{
    width:100%;
    padding:8px;
    margin-bottom:10px;
    border-radius:8px;
    border:none;
    box-sizing:border-box;
}

.log{
    margin-top:10px;
    background:#111;
    padding:10px;
    border-radius:10px;
    min-height:50px;
}

.dex{
    margin-top:15px;
    background:#181818;
    border-radius:10px;
    padding:10px;
}

.dex-item{
    padding:5px;
}
.monster-card{

    margin-top:15px;

    padding:20px;

    border-radius:20px;

    min-height:220px;
}
.fire{
    background:linear-gradient(135deg,#ff512f,#dd2476);
}

.water{
    background:linear-gradient(135deg,#2193b0,#6dd5ed);
}

.thunder{
    background:linear-gradient(135deg,#f7971e,#ffd200);
    color:black;
}

.nature{
    background:linear-gradient(135deg,#56ab2f,#a8e063);
    color:black;
}

.dark{
    background:linear-gradient(135deg,#41295a,#2f0743);
}
.rarity{

    font-size:20px;
    font-weight:bold;

    margin:10px 0;
}
.ssr{
    color:#ffd700;
    text-shadow:0 0 10px gold;
}

.sr{
    color:#ff66ff;
}

.r{
    color:#66ccff;
}

.n{
    color:#ffffff;
}
.evolving{

    animation:
    flash 0.3s infinite;
}

@keyframes flash{

    0%{
        opacity:1;
    }

    50%{
        opacity:0;
    }

    100%{
        opacity:1;
    }
}
#monsterImage{

    width:100%;
    max-width:450px;

    display:block;
    margin:auto;

    border-radius:15px;

    object-fit:contain;
}

</style>

</head>
<body>

<div class="game">

<h1>フィギュアモンスターズ</h1>

<label>モンスター名</label>
<input id="nickname" placeholder="名前を入力">

id="monsterImage"

</div>

<hr><div class="dex">

let level = 1;
let exp = 0;
let hunger = 50;

let dex = [];

let imageData = "";

let scanned = false;
let branch = "";
let awakeningStone = 0;
let rebirthPoint = 0;
let nextBranch = "";
let completedBranches = [];

function updateUI(){

document.getElementById("level").innerText = level;

document.getElementById("species").innerText =
monsters[stage].name;
const image =
document.getElementById(
    "monsterImage"
);

if(monsterImages[stage]){

    image.src =
    monsterImages[stage];

}
else{

    image.src =
    "images/egg.png";

}

document.getElementById("expBar").style.width =
exp + "%";

document.getElementById("hungerBar").style.width =
hunger + "%";
const hungerBar =
document.getElementById("hungerBar");

if(hunger > 50){

    hungerBar.style.background =
    "limegreen";

}
else if(hunger > 20){

    hungerBar.style.background =
    "orange";

}
else{

}

completedBranches.length +

let nickname =
document.getElementById("nickname").value;

document.getElementById("displayName").innerText =

nickname || "未設定";

).innerText =

dex.length +
" / " +
monsters.length;
document.getElementById(

).innerHTML = `
${completedBranches.includes("fire") ? "✅" : "⬜"} 火<br>
${completedBranches.includes("water") ? "✅" : "⬜"} 水<br>
${completedBranches.includes("thunder") ? "✅" : "⬜"} 雷<br>
${completedBranches.includes("nature") ? "✅" : "⬜"} 自然<br>
${completedBranches.includes("dark") ? "✅" : "⬜"} 闇
`;

function log(text){
document.getElementById("log").innerText = text;
}

function feed(){

hunger += 10;

if(hunger > 100){
hunger = 100;
}

log("ごはんを食べた！");
saveGame();
updateUI();
}

function train(){

    if(hunger < 10){

        log("おなかが減って訓練できない！");
        return;
    }

    exp += 20;

    hunger -= 5;

    if(hunger < 0){

        hunger = 0;
    }

    if(exp >= 100){

        exp = 0;

        level++;

        log(
            "レベルアップ！ Lv" +
            level
        );

        if(level % 10 === 0){

            awakeningStone++;

            rarityUpgrade();
        }

        evolve();
    }

    saveGame();
    updateUI();
}

function awaken(){

    if(rarity === "★★★★★ SSR"){

        log("すでにSSRです！");
        return;
    }

    if(awakeningStone < 5){

        log("覚醒石が足りません！");
        return;
    }

    awakeningStone -= 5;

    if(rarity === "★★ N"){

        rarity = "★★★ R";
    }
    else if(rarity === "★★★ R"){

        rarity = "★★★★ SR";
    }
    else if(rarity === "★★★★ SR"){

        rarity = "★★★★★ SSR";
    }

    log("💎 覚醒成功！");

    updateMonsterCard();

    saveGame();
    updateUI();
}
function rebirth(){

    if(stage < 22){

        log(
            "神話モンスターでのみ転生できます！"
        );

        return;
    }

    document.getElementById(
        "rebirthSelect"
    ).style.display = "block";

}


function selectBranch(type){

    nextBranch = type;

    rebirthPoint++;

    level = 1;
    exp = 0;
    hunger = 50;

    stage = 0;

    rarity = "★★ N";

    const types = [

    "パワー型",
    "スピード型",
    "防御型",
    "回復型"

];

buildType =

types[
    Math.floor(
        Math.random() *
        types.length
    )
];

    if(type === "fire"){

        element = "🔥 火";
        branch = "fire";
    }
    else if(type === "water"){

        element = "💧 水";
        branch = "water";
    }
    else if(type === "thunder"){

        element = "⚡ 雷";
        branch = "thunder";
    }
    else if(type === "nature"){

        element = "🌿 自然";
        branch = "nature";
    }
    else if(type === "dark"){

        element = "🌙 闇";
        branch = "dark";
    }

    scanned = true;

    document.getElementById(
        "element"
    ).textContent = element;

    document.getElementById(
        "buildType"
    ).textContent = buildType;

    document.getElementById(
        "rebirthSelect"
    ).style.display = "none";

    updateMonsterCard();

    log(
        "🔄 転生完了！"
    );

    saveGame();
    updateUI();
}
function evolveWithEffect(
    newStage,
    message
){

    const monster =
    document.getElementById(
    "monsterImage"
);

    monster.classList.add(
        "evolving"
    );

    log("✨✨✨進化中...✨✨✨");

    setTimeout(() => {

        stage = newStage;

        unlockMonster(newStage);

        monster.classList.remove(
            "evolving"
        );

        log(message);
if(newStage >= 22){

    if(
        !completedBranches.includes(
            branch
        )
    ){

        completedBranches.push(
            branch
        );
    }

}

        saveGame();

        updateUI();

    }, 2000);

}
function evolve(){

    const normalEvolution =
    evolutionTable.find(e =>

        e.from === stage &&
        level >= e.level

    );

    if(normalEvolution){

        evolveWithEffect(
            normalEvolution.to,
            normalEvolution.text
        );

        return;
    }

    const branchTable =
    branchEvolutionTable[branch];

    if(!branchTable){

        return;
    }

    const branchEvolution =
    branchTable.find(e => {

        if(e.from !== stage){

            return false;
        }

        if(level < e.level){

            return false;
        }

        if(
            e.rarity &&
            rarity !== e.rarity
        ){

            return false;
        }

        return true;

    });

    if(!branchEvolution){

        return;
    }

    evolveWithEffect(

        branchEvolution.to,

        branchEvolution.text

    );

}


function unlockMonster(id){

if(!dex.includes(id)){
dex.push(id);
}
}

function renderDex(){

let html = "";

dex.forEach(id => {

html += `
<div class="dex-item">
${monsters[id].emoji}
${monsters[id].name}
</div>
`;

});

if(html === ""){
html = "未発見";
}

document.getElementById("dexList").innerHTML =
html;
}

function saveGame(){

const saveData = {

level,
exp,
hunger,
awakeningStone,
rebirthPoint,
completedBranches,
stage,
dex,


nickname:
document.getElementById("nickname").value,

element,
buildType,

rarity,
scanned,
branch,
nextBranch,
lastPlayed: Date.now()

};
localStorage.setItem(
"figureMonsterSave",
JSON.stringify(saveData)
);
}

function loadGame(){

    const raw =
    localStorage.getItem(
        "figureMonsterSave"
    );

    if(!raw){

        unlockMonster(0);
        return;
    }

const data =
JSON.parse(raw);

rarity =
data.rarity || "";
scanned =
data.scanned || false;
branch =
data.branch || "";
nextBranch =
data.nextBranch || "";
level = data.level;
exp = data.exp;
hunger = data.hunger;
awakeningStone =
data.awakeningStone || 0;

rebirthPoint =
data.rebirthPoint || 0;
completedBranches =
data.completedBranches || [];

stage = data.stage;
dex = data.dex || [0];

const now = Date.now();

const minutes =
Math.floor(
(now - data.lastPlayed) /
60000
);

hunger -= minutes;

if(hunger < 0){

    hunger = 0;
}

document.getElementById("nickname").value =
data.nickname || "";
element =
data.element || "";

buildType =
data.buildType || "";



document.getElementById("element")
.textContent =
element || "未設定";

document.getElementById("buildType")
.textContent =
buildType || "未設定";


if(element){

    updateMonsterCard();
}

if(scanned){

    document.getElementById(
        "scanButton"
    ).style.display = "none";
}

log("セーブデータを読み込みました");
}

function resetGame(){

if(confirm("データを削除しますか？")){

localStorage.removeItem(
"figureMonsterSave"
);

location.reload();
}
}
function updateMonsterCard(){

    const card =
    document.getElementById("monsterCard");

    card.style.display = "block";

    card.className = "monster-card";

    document.getElementById("cardTitle")
    .innerText =
    document.getElementById("nickname").value ||
    "名無しモンスター";

    document.getElementById("cardElement")
    .innerText = element;

    document.getElementById("cardType")
    .innerText = buildType;

    document.getElementById("cardRarity")
    .innerText = rarity;

    if(element.includes("火")){

        card.classList.add("fire");

    }else if(element.includes("水")){

        card.classList.add("water");

    }else if(element.includes("雷")){

        card.classList.add("thunder");

    }else if(element.includes("自然")){

        card.classList.add("nature");

    }else if(element.includes("闇")){

        card.classList.add("dark");
    }

    const rarityLabel =
    document.getElementById("cardRarity");

    rarityLabel.className = "rarity";

   if(rarity === "★★★★★ SSR"){

    rarityLabel.classList.add("ssr");

}
else if(rarity === "★★★★ SR"){

    rarityLabel.classList.add("sr");

}
else if(rarity === "★★★ R"){

    rarityLabel.classList.add("r");

}
else{

    rarityLabel.classList.add("n");

}

}
function rarityUpgrade(){

    const roll = Math.random();

    if(rarity === "★★ N"){

        if(roll < 0.6){

            rarity = "★★★ R";

            log("🌟 N → R に昇格！");
        }
    }

    else if(rarity === "★★★ R"){

        if(roll < 0.4){

            rarity = "★★★★ SR";

            log("✨ R → SR に昇格！");
        }
    }

    else if(rarity === "★★★★ SR"){

        if(roll < 0.05){

            rarity = "★★★★★ SSR";

            log("👑 SR → SSR に昇格！");
        }
    }

    updateMonsterCard();
}
function analyzeImage(){

    if(scanned){
