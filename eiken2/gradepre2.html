<html lang="ja">
<head>

<title>英検準2級 模試</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui;
  background:#f1f5f9;
  color:#0f172a;
}
.wrap{
  max-width:620px;
  margin:auto;
}
.start{
  min-height:100vh;
  display:flex;
  align-items:center;
  padding:20px;
  background:#08111f;
  color:white;
}
.card{
  background:white;
  border-radius:24px;
  padding:22px;
  box-shadow:0 12px 30px #0002;
}
.start .card{
  background:#111c2e;
}
.green{
  color:#34d399;
}
.primary{
  width:100%;
  border:0;
  border-radius:16px;
  padding:15px;
  background:#34d399;
  font-weight:900;
  cursor:pointer;
}
.hide{
  display:none!important;
}
header{
  position:sticky;
  top:0;
  background:#08111f;
  color:white;
  padding:12px 16px;
}
.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.main{
  padding:16px;
  padding-bottom:120px;
}
.choice{
  display:block;
  width:100%;
  padding:14px;
  margin:8px 0;
}
footer{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  padding:10px;
  border-top:1px solid #ddd;
}
.nav{
  max-width:620px;
  margin:auto;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.nav button{
  padding:12px;
  border-radius:12px;
}
.feedback{
  margin-top:12px;
  padding:12px;
  border-radius:12px;
  background:#eff6ff;
}
.choice.active{
  background:#dcfce7;
  border:2px solid #22c55e;
}
#jump{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:6px;
  margin-top:15px;
}

.jumpBtn{
  padding:8px;
  border:none;
  border-radius:8px;
  background:#e2e8f0;
  cursor:pointer;
}

.jumpBtn.current{
  background:#0f172a;
  color:white;
}

.jumpBtn.done{
  background:#86efac;
}
.jumpBtn.wrong{
  background:#fca5a5;
  color:#7f1d1d;
}
.questionNav{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}

.questionNav button{
  padding:14px;
  border-radius:12px;
  border:1px solid #ccc;
  cursor:pointer;
  background:white;
}
.rounds{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin:15px 0;
}

.roundBtn{
  border:none;
  border-radius:10px;
  padding:10px;
  background:#e2e8f0;
  cursor:pointer;
  font-weight:bold;
}

.roundBtn.active{
  background:#34d399;
}
</style>
</head>

      <button class="roundBtn" data-round="3">第4回</button>

<button

<button

  <div class="nav">

    </button>

</footer>

RANDOM_MODE = false;

      .forEach(b=>{
        b.classList.remove("active");
      });

     btn.classList.add("active");

     ROUND =
      Number(btn.dataset.round);

   };

 });
$("#randomMode").onclick = ()=>{

  RANDOM_MODE = true;

  document
   .querySelectorAll(".roundBtn")

     b.classList.remove("active");
   });

  $("#randomMode")
    .classList.add("active");

};
function shuffle(arr){

  for(let i = arr.length - 1; i > 0; i--){

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );

    [arr[i], arr[j]] =
    [arr[j], arr[i]];

  }

}

function load(){

 
if(RANDOM_MODE){

  let vocab = [];
  let reading = [];
 

  BANK.flat().forEach(q=>{

    if(q.s === "長文読解"){
      reading.push(q);
    }
   
    else{
      vocab.push(q);
    }

  });

  shuffle(vocab);
  shuffle(reading);

  Q = [

    ...vocab.slice(0,32),

    ...reading.slice(0,8),


  ];

}
else{

  Q = JSON.parse(
    JSON.stringify(
      BANK[ROUND] || []
    )
  );

}
  Q.forEach(q=>{

  if(!q.c) return;

  let items = q.c.map(
    (text,n)=>({
      text,
      ok:n===q.a
    })
  );

  shuffle(items);

  q.c = items.map(v=>v.text);

  q.a = items.findIndex(v=>v.ok);

});

}

       ">
    <h3>
      問${n+1}
      ${correct ? "○" : "×"}
    </h3>

    <p>
      <b>問題</b><br>
      ${q.p}
    </p>

    <p>
      <b>正答</b><br>
      ${answerText}
    </p>

    <p>
      <b>全訳</b><br>
      ${q.jp || q.samplejp || ""}
    </p>

    <p>
      <b>解説</b><br>
      ${q.ex}
    </p>
  </div>
  `;
})
.join("");

}
$("#go").onclick = ()=>{
  ans = {};
  i = 0;

  load();

  $("#start").classList.add("hide");
  $("#exam").classList.remove("hide");
  render();
};

window.onload = ()=>{

  $("#home").onclick = ()=>{
    if(confirm("タイトル画面へ戻りますか？")){
      location.reload();
    }
  };

  $("#explainBtn").onclick = ()=>{
    showExplanation();
  };

};
</script>

</body>
</html>
