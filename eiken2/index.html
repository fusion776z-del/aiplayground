<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>英検 全5回シリーズ</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#08111f;
  font-family:system-ui,sans-serif;
}

.container{
  width:95%;
  max-width:700px;
}

.card{
  background:#111c2e;
  border-radius:28px;
  padding:32px;
  box-shadow:0 15px 40px rgba(0,0,0,.3);
  text-align:center;
  color:white;
}

.badge{
  color:#34d399;
  font-weight:bold;
}

h1{
  margin:10px 0 16px;
  font-size:38px;
}

.desc{
  color:#cbd5e1;
  margin-bottom:28px;
}

.menu{
  display:grid;
  gap:16px;
}

.grade{
  display:block;
  text-decoration:none;
  color:white;
  padding:20px;
  border-radius:18px;
  font-size:20px;
  font-weight:bold;
  transition:.2s;
}

.grade:hover{
  transform:translateY(-3px);
}

.g4{
  background:#22c55e;
}

.g3{
  background:#3b82f6;
}

.gpre2{
  background:#f59e0b;
}

.g2{
  background:#dc2626;
}

.sub{
  display:block;
  font-size:13px;
  opacity:.9;
  margin-top:4px;
}

.footer{
  margin-top:24px;
  color:#94a3b8;
  font-size:14px;
}
</style>
</head>

<body>

<div class="container">
  <div class="card">

    <div class="badge">
      スマホ筆記模試
    </div>

    <h1>
      英検 全5回+総合ランダムシリーズ
    </h1>

    <p class="desc">
      受験したい級を選んでください
    </p>

    <div class="menu">

      <a href="grade4.html" class="grade g4">
        英検4級
      </a>

      <a href="grade3.html" class="grade g3">
        英検3級
      </a>

      <a href="gradepre2.html" class="grade gpre2">
        英検準2級
      </a>

      <a href="grade2.html" class="grade g2">
        英検2級
      </a>

    </div>

  

  </div>
</div>

</body>
</html>
