<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>英検準2級 模試</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui;
        background: #f1f5f9;
        color: #0f172a;
      }
      button,
      textarea {
        font: inherit;
      }
      .hide {
        display: none !important;
      }
      .wrap {
        max-width: 620px;
        margin: auto;
      }
      .start {
        min-height: 100dvh;
        background: #08111f;
        color: white;
        padding: 20px;
        display: flex;
        align-items: center;
      }
      .card {
        background: white;
        border-radius: 24px;
        padding: 22px;
        box-shadow: 0 12px 30px #0002;
      }
      .start .card {
        background: #111c2e;
      }
      .green {
        color: #34d399;
      }
      .modes {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .rounds {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 6px;
        margin: 16px 0;
      }
      .sel {
        border: 2px solid #334155;
        background: #1e293b;
        color: white;
        border-radius: 14px;
        padding: 11px 3px;
        font-weight: 800;
      }
      .sel.on {
        border-color: #34d399;
        background: #064e3b;
      }
      .primary {
        width: 100%;
        border: 0;
        border-radius: 16px;
        padding: 15px;
        background: #34d399;
        font-weight: 900;
      }
      header {
        position: sticky;
        top: 0;
        background: #08111f;
        color: white;
        padding: 12px 16px;
        z-index: 2;
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .main {
        padding: 16px 16px 115px;
      }
      .pass {
        white-space: pre-line;
        background: #f8fafc;
        padding: 14px;
        border-radius: 15px;
        line-height: 1.7;
      }
      .prompt {
        white-space: pre-line;
        font-size: 18px;
        font-weight: 750;
        line-height: 1.7;
      }
      .choice {
        display: block;
        width: 100%;
        text-align: left;
        border: 2px solid #e2e8f0;
        background: white;
        border-radius: 15px;
        padding: 14px;
        margin: 9px 0;
      }
      .choice.on {
        border-color: #10b981;
        background: #ecfdf5;
      }
      .feedback {
        padding: 14px;
        border-radius: 15px;
        margin-top: 12px;
        line-height: 1.7;
      }
      .ok {
        background: #ecfdf5;
      }
      .ng {
        background: #fff1f2;
      }
      .sample {
        background: #eff6ff;
      }
      .jp {
        border-top: 1px solid #94a3b8;
        margin-top: 8px;
        padding-top: 8px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: 6px;
        margin-top: 14px;
      }
      .jump {
        aspect-ratio: 1;
        border: 0;
        border-radius: 8px;
        background: white;
      }
      .jump.cur {
        background: #08111f;
        color: white;
      }
      .jump.done {
        background: #a7f3d0;
      }
      textarea {
        width: 100%;
        height: 190px;
        border: 2px solid #e2e8f0;
        border-radius: 15px;
        padding: 13px;
      }
      .check {
        width: 100%;
        padding: 12px;
        border: 0;
        border-radius: 14px;
        background: #0f172a;
        color: white;
        font-weight: 800;
        margin-top: 9px;
      }
      footer {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: white;
        padding: 10px 14px;
        border-top: 1px solid #ddd;
      }
      .nav {
        max-width: 620px;
        margin: auto;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 9px;
      }
      .nav button {
        padding: 12px;
        border-radius: 14px;
        border: 1px solid #ccc;
        font-weight: 800;
      }

      .back-title {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 38px;
        padding: 8px 11px;
        color: #d1fae5;
        font-size: 13px;
        font-weight: 800;
        background: rgba(52, 211, 153, 0.12);
        border: 1px solid rgba(110, 231, 183, 0.45);
        border-radius: 999px;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
        transition:
          background 0.2s ease,
          transform 0.2s ease;
      }

      .back-title:hover {
        background: rgba(52, 211, 153, 0.22);
      }

      .back-title:active {
        transform: scale(0.96);
      }

      .back-title-icon {
        display: grid;
        place-items: center;
        width: 22px;
        height: 22px;
        color: #052e2b;
        font-size: 14px;
        line-height: 1;
        background: #6ee7b7;
        border-radius: 50%;
      }
    </style>
  </head>
  <body>
    <section id="start" class="start">
      <div class="wrap card">
        <b class="green">スマホ筆記模試</b>
        <h1>英検準2級 全5回</h1>
        <div class="modes">
          <button class="sel on" data-m="test">
            テストモード<small style="display: block">最後に採点</small></button
          ><button class="sel" data-m="practice">
            練習モード<small style="display: block">1問ごとに解説</small>
          </button>
        </div>
        <div id="rounds" class="rounds"></div>
        <button id="go" class="primary">開始する</button>
      </div>
    </section>
    <section id="exam" class="hide">
      <header>
        <div class="wrap row">
          <button
            id="back-title"
            class="back-title"
            aria-label="タイトル画面へ戻る"
          >
            <span class="back-title-icon" aria-hidden="true">⌂</span>
            <span>タイトル</span>
          </button>
          <b id="where"></b>
          <b id="time">80:00</b>
        </div>
      </header>
      <main class="wrap main">
        <div class="card">
          <b id="no" class="green"></b>
          <div id="pass" class="pass hide"></div>
          <div id="prompt" class="prompt"></div>
          <div id="input"></div>
          <div id="fb" class="hide"></div>
        </div>
        <div id="grid" class="grid"></div>
      </main>
      <footer>
        <div class="nav">
          <button id="prev">‹ 前へ</button
          ><button id="next" style="background: #34d399">次へ ›</button>
        </div>
      </footer>
    </section>
    <section id="result" class="hide">
      <div class="wrap main">
        <div class="card">
          <b class="green">採点結果</b>
          <h1 id="score"></h1>
          <div id="reviews"></div>
          <button class="primary" onclick="location.reload()">回選択へ</button>
        </div>
      </div>
    </section>

        $("#pass").classList.toggle("hide", !q.text);
        if (q.c) {
          $("#input").innerHTML = q.c
            .map(
              (x, n) =>
                `<button class="choice ${ans[i] === n ? "on" : ""}" data-n="${n}">${String.fromCharCode(65 + n)}. ${x}</button>`,
            )
            .join("");
          document.querySelectorAll(".choice").forEach(
            (b) =>
              (b.onclick = () => {
                ans[i] = +b.dataset.n;
                if (mode === "practice") seen[i] = 1;
                render();
              }),
          );
        } else {
          $("#input").innerHTML =
            '<textarea placeholder="Write in English..."></textarea><b id="words"></b>' +
            (mode === "practice"
              ? '<button id="check" class="check">解答例・全訳・解説を確認</button>'
              : "");
          let t = $("textarea");
          t.value = ans[i] || "";
          $("#words").textContent = wc(t.value) + " words";
          t.oninput = () => {
            ans[i] = t.value;
            $("#words").textContent = wc(t.value) + " words";
          };
          if ($("#check"))
            $("#check").onclick = () => {
              seen[i] = 1;
              render();
            };
        }
        feedback(q);
        $("#prev").disabled = i === 0;
        $("#next").textContent = i === 25 ? "提出する" : "次へ ›";
        $("#grid").innerHTML = Q.map(
          (_, n) =>
            `<button class="jump ${n === i ? "cur" : ans[n] !== undefined && ans[n] !== "" ? "done" : ""}" data-j="${n}">${n + 1}</button>`,
        ).join("");
        document.querySelectorAll("[data-j]").forEach(
          (b) =>
            (b.onclick = () => {
              i = +b.dataset.j;
              render();
            }),
        );
      }
      function detail(q) {
        return q.c
          ? `<div><b>正答:</b> ${q.c[q.a]}</div><div class="jp"><b>全訳:</b> ${q.jp}</div>${q.textjp ? `<div><b>本文全訳:</b> ${q.textjp}</div>` : ""}<div><b>解説:</b> ${q.ex}</div>`
          : `<div><b>解答例:</b> ${q.sample}</div><div class="jp"><b>全訳:</b> ${q.samplejp}</div><div><b>解説:</b> ${q.ex}</div>`;
      }
      function feedback(q) {
        let f = $("#fb");
        f.className = "hide";
        if (mode !== "practice" || !seen[i]) return;
        f.className =
          "feedback " + (q.c ? (ans[i] === q.a ? "ok" : "ng") : "sample");
        f.innerHTML =
          (q.c
            ? `<b>${ans[i] === q.a ? "正解です！" : "不正解です"}</b>`
            : "") + detail(q);
      }
      function finish() {
        clearInterval(timer);
        $("#exam").classList.add("hide");
        $("#result").classList.remove("hide");
        let s = Q.slice(0, 24).reduce((a, q, n) => a + (ans[n] === q.a), 0);
        $("#score").textContent = `第${r + 1}回 ${s}/24`;
        $("#reviews").innerHTML = Q.map(
          (q, n) =>
            `<div class="feedback ${q.c ? (ans[n] === q.a ? "ok" : "ng") : "sample"}"><b>${n + 1}. ${q.s}</b>${detail(q)}</div>`,
        ).join("");
      }
      function returnToTitle() {
        const hasAnswers = Object.keys(ans).length > 0;
        const message = hasAnswers
          ? "タイトル画面に戻ります。現在の解答は消去されます。よろしいですか？"
          : "タイトル画面に戻りますか？";

        if (!window.confirm(message)) return;

        if (timer) {
          clearInterval(timer);
          timer = null;
        }

        $("#exam").classList.add("hide");
        $("#result").classList.add("hide");
        $("#start").classList.remove("hide");

        sec = 4800;
        i = 0;
        ans = {};
        seen = {};
        Q = [];
        $("#time").textContent = "80:00";
        window.scrollTo(0, 0);
      }

      $("#back-title").onclick = returnToTitle;

      $("#go").onclick = () => {
        load();
        $("#start").classList.add("hide");
        $("#exam").classList.remove("hide");
        render();
        if (mode === "practice") {
          $("#time").textContent = "時間制限なし";
        } else {
          timer = setInterval(() => {
            sec--;
            $("#time").textContent =
              String((sec / 60) | 0).padStart(2, "0") +
              ":" +
              String(sec % 60).padStart(2, "0");
            if (sec <= 0) finish();
          }, 1000);
        }
      };
      $("#prev").onclick = () => {
        if (i) {
          i--;
          render();
        }
      };
      $("#next").onclick = () => (i < 25 ? (i++, render()) : finish());
    </script>
  </body>
</html>
