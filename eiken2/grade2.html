let Q = [];
let i = 0;
let ans = {};
let ROUND = 0;

let RANDOM_MODE = false;
const $ = x => document.querySelector(x);
document
 .querySelectorAll(".roundBtn")
 .forEach(btn=>{

   btn.onclick=()=>{

     document
      .querySelectorAll(".roundBtn")
      .forEach(b=>{
        b.classList.remove("active");
      });

     btn.classList.add("active");

RANDOM_MODE = false;

document
 .getElementById("randomMode")
 .classList.remove("active");

ROUND =
 Number(btn.dataset.round);

   };

 });
$("#randomMode").onclick = ()=>{

  RANDOM_MODE = true;

  document
   .querySelectorAll(".roundBtn")
   .forEach(b=>{
     b.classList.remove("active");
   });

  $("#randomMode")
    .classList.add("active");

};
function shuffle(arr){

  for(let i = arr.length - 1; i > 0; i--){

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );

    [arr[i], arr[j]] =
    [arr[j], arr[i]];

  }

}

function load(){

 
if(RANDOM_MODE){

  let vocab = [];
  let reading = [];
  let email = [];


  BANK.flat().forEach(q=>{

    if(q.s === "長文読解"){
      reading.push(q);
    }
    else if(q.s === "Eメール読解"){
      email.push(q);
    }
    else{
      vocab.push(q);
    }

  });

  shuffle(vocab);
  shuffle(reading);
  shuffle(email);

  Q = [

    ...vocab.slice(0,25),
    ...email.slice(0,5),
    ...reading.slice(0,10),
  ];
}
else{
  let src = JSON.parse(
    JSON.stringify(
      BANK[ROUND] || []
    )
  );

  let vocab = [];
  let email = [];
  let reading = [];

  src.forEach(q => {
    if(q.s === "Eメール読解"){
      email.push(q);
    }
    else if(q.s === "長文読解"){
      reading.push(q);
    }
    else{
      vocab.push(q);
    }
  });

  Q = [
    ...vocab,
    ...email,
    ...reading
  ];
}
  Q.forEach(q=>{

  if(!q.c) return;

  let items = q.c.map(
    (text,n)=>({
      text,
      ok:n===q.a
    })
  );

  shuffle(items);

  q.c = items.map(v=>v.text);

  q.a = items.findIndex(v=>v.ok);

});

}
function prevQuestion(){
  if(i > 0){
    i--;
    render();
  }
}

function nextQuestion(){
  if(i < Q.length - 1){
    i++;
    render();
  }else{
    finish();
  }
}
function render(){

  let q = Q[i];

 $("#where").textContent =
RANDOM_MODE
 ? `総合ランダム ${i+1}/${Q.length}`
 : `第${ROUND+1}回 ${i+1}/${Q.length}`;

$("#no").textContent =
 `QUESTION ${i+1}`;

  $("#pass").innerHTML = q.text
    ? `
        <div class="feedback">
          ${q.text}
        </div>
      `
    : "";

  $("#prompt").textContent =
    q.p;
  let html = "";


if(q.c){

  q.c.forEach((choice,n)=>{

    html += `
      <button
        class="choice ${ans[i]===n ? 'active' : ''}"
        onclick="selectAnswer(${n})">
        ${String.fromCharCode(65+n)}.
        ${choice}
      </button>
    `;

  });

}else{

  html += `
    <textarea
 onchange="ans[i]=this.value"
>${ans[i]||""}</textarea>
  `;

}

html += `
<div class="questionNav">

<button
 onclick="prevQuestion()">
‹ 前へ
</button>

<button
 onclick="nextQuestion()">
次へ ›
</button>

</div>
`;
 

$("#input").innerHTML = html;
$("#jump").innerHTML =

Q.map((q,n)=>{

  let cls = "jumpBtn";

 if(n===i){
  cls += " current";
}
else if(ans[n]!==undefined){

  // 英作文
  if(!Q[n].c){
    cls += " done";
  }
  else if(ans[n]===Q[n].a){
    cls += " done";
  }
  else{
    cls += " wrong";
  }

}


  return `
    <button
      class="${cls}"
      onclick="jumpTo(${n})">
      ${n+1}
    </button>
  `;

}).join("");
$("#fb").innerHTML = "";

}

function selectAnswer(n){

  ans[i] = n;

  render();

}

function jumpTo(n){

  i = n;

  render();

}

function showExplanation(){

  let q = Q[i];

  let correct =
    ans[i] === q.a;

  $("#fb").innerHTML = `
    <div class="feedback">
      <b>
      ${correct ? "○ 正解" : "× 不正解"}
      </b>

      <p>
      正答：
      ${q.c ? q.c[q.a] : "模範解答を参照"}
      </p>

      <p>
      全訳：
      ${q.jp || q.samplejp || ""}
      </p>

      <p>
      解説：
      ${q.ex}
      </p>

    </div>
  `;

  $("#fb").scrollIntoView({
    behavior:"smooth",
    block:"start"
  });

}

function finish(){

 let score = Q.reduce(
  (a,q,n)=>{
    if(!q.c) return a;
    return a + (ans[n] === q.a);
  },
  0
);


  // 試験画面を隠す
  $("#exam").classList.add("hide");

  // 結果画面を表示
  $("#result").classList.remove("hide");

  // スコア表示
 $("#score").textContent =
RANDOM_MODE
 ? `総合ランダム ${score}/${Q.length}`
 : `第${ROUND+1}回 ${score}/${Q.length}`;

  // 復習一覧生成
  $("#reviews").innerHTML =

    Q.map((q,n)=>{

      const correct =
        ans[n]===q.a;

      return `

      <div class="feedback"
           style="
             margin-bottom:15px;
             background:${
               correct
                 ? '#dcfce7'
                 : '#fee2e2'
             };
           ">

        <h3>
          問${n+1}
          ${correct ? "○" : "×"}
        </h3>

        <p>
          <b>問題</b><br>
          ${q.p}
        </p>

        <p>
          <b>正答</b><br>
${q.c ? q.c[q.a] : q.sample}
        </p>

        <p>
          <b>全訳</b><br>
          ${q.jp || q.samplejp || ""}
        </p>

        <p>
          <b>解説</b><br>
          ${q.ex}
        </p>

      </div>

      `;

    }).join("");

}
$("#go").onclick = ()=>{

  if(!BANK[0].length){

    alert(
      "まだ問題が登録されていません。"
    );

    return;
  }

  load();

  $("#start").classList.add("hide");
  $("#exam").classList.remove("hide");

  render();

};

window.onload = ()=>{

  $("#home").onclick = ()=>{
    if(confirm("タイトル画面へ戻りますか？")){
      location.reload();
    }
  };

  $("#explainBtn").onclick = ()=>{
    showExplanation();
  };

};
</script>

</body>
</html>
