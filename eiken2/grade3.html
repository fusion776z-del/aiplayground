  color:white;

}

  width:100%;
  border:0;

.hide{

}
header{

  top:0;
  background:#08111f;
  color:white;

  display:flex;
  justify-content:space-between;
  align-items:center;
}
.main{
  padding:16px;
  padding-bottom:120px;
}
.choice{
  display:block;
  width:100%;
  padding:14px;
  margin:8px 0;
}
footer{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  padding:10px;
  border-top:1px solid #ddd;
}
.nav{
  max-width:620px;
  margin:auto;
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
}
.nav button{
  padding:12px;
  border-radius:12px;
}
.feedback{
  margin-top:12px;
  padding:12px;
  border-radius:12px;
  background:#eff6ff;
}
.choice.active{
  background:#dcfce7;
  border:2px solid #22c55e;
}
#jump{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:6px;
  margin-top:15px;
}

.jumpBtn{
  padding:8px;
  border:none;
  border-radius:8px;
  background:#e2e8f0;
  cursor:pointer;
}

.jumpBtn.current{
  background:#0f172a;
  color:white;
}

.jumpBtn.done{
  background:#86efac;
}
.rounds{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin:15px 0;
}

.roundBtn{
  border:none;
  border-radius:10px;
  padding:10px;
  background:#e2e8f0;
  cursor:pointer;
  font-weight:bold;
}

.roundBtn.active{
  background:#34d399;
}
</style>

</div>

</main>

<footer>
<div class="nav">
<button id="home">タイトル</button>
<button id="prev">‹ 前へ</button>

</footer>

let Q = [];
let i = 0;
let ans = {};
let ROUND = 0;

let RANDOM_MODE = false;
const $ = x => document.querySelector(x);
document
 .querySelectorAll(".roundBtn")
 .forEach(btn=>{

   btn.onclick=()=>{

     document
      .querySelectorAll(".roundBtn")
      .forEach(b=>{
        b.classList.remove("active");
      });

     btn.classList.add("active");

     ROUND =
      Number(btn.dataset.round);

   };

 });
$("#randomMode").onclick = ()=>{

  RANDOM_MODE = true;

  document
   .querySelectorAll(".roundBtn")
   .forEach(b=>{
     b.classList.remove("active");
   });

  $("#randomMode")
    .classList.add("active");

};
function shuffle(arr){

  for(let i = arr.length - 1; i > 0; i--){

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );

    [arr[i], arr[j]] =
    [arr[j], arr[i]];

  }

}

function load(){

 
if(RANDOM_MODE){

  let vocab = [];
  let conversation = [];
  let order = [];
  let reading = [];
  let email = [];

  BANK.flat().forEach(q=>{

    if(q.s==="語句補充"){
      vocab.push(q);
    }
    else if(q.s==="会話文"){
      conversation.push(q);
    }
    else if(q.s==="語順整序"){
      order.push(q);
    }
    else if(q.s==="長文読解"){
      reading.push(q);
    }
    else if(q.s==="Eメール読解"){
      email.push(q);
    }

  });

  shuffle(vocab);
  shuffle(conversation);
  shuffle(order);
  shuffle(reading);
  shuffle(email);

  Q = [
    ...vocab.slice(0,15),
    ...conversation.slice(0,5),
    ...order.slice(0,5),
    ...reading.slice(0,10),
    ...email.slice(0,5)
  ];
}
else{

  Q = JSON.parse(
    JSON.stringify(BANK[ROUND] || [])
  );

}
  Q.forEach(q=>{

    let items = q.c.map(
      (text,n)=>({
        text:text,
        ok:n===q.a
      })
    );

    shuffle(items);

    q.c = items.map(
      v=>v.text
    );

    q.a = items.findIndex(
      v=>v.ok
    );

  });

}

function render(){

  let q = Q[i];

 $("#where").textContent =
 RANDOM_MODE
 ? `総合ランダム ${i+1}/40`
 : `第${ROUND+1}回 ${i+1}/40`;

  $("#no").textContent =
    `QUESTION ${i+1}`;

  $("#pass").innerHTML = q.text
    ? `
        <div class="feedback">
          ${q.text}
        </div>
      `
    : "";

  $("#prompt").textContent =
    q.p;
  let html = "";

  q.c.forEach((choice,n)=>{

    html += `
      <button
       class="choice ${ans[i]===n ? 'active':''}"
        onclick="selectAnswer(${n})">
        ${String.fromCharCode(65+n)}.
        ${choice}
      </button>
    `;

  });

  html += `
<button
  class="primary"
  onclick="showExplanation()">
  解説を見る
</button>
`;

$("#input").innerHTML = html;
$("#jump").innerHTML =

Q.map((q,n)=>{

  let cls = "jumpBtn";

  if(n===i){
    cls += " current";
  }
  else if(ans[n]!==undefined){
    cls += " done";
  }

  return `
    <button
      class="${cls}"
      onclick="jumpTo(${n})">
      ${n+1}
    </button>
  `;

}).join("");
$("#fb").innerHTML = "";

}

function selectAnswer(n){

  ans[i] = n;

  render();

}

function jumpTo(n){

  i = n;

  render();

}

function showExplanation(){

  let q = Q[i];

  let correct =
    ans[i] === q.a;

  $("#fb").innerHTML = `
    <div class="feedback">
      <b>
      ${correct ? "○ 正解" : "× 不正解"}
      </b>

      <p>
      正答：
      ${q.c[q.a]}
      </p>

      <p>
      全訳：
      ${q.jp}
      </p>

      <p>
      解説：
      ${q.ex}
      </p>

    </div>
  `;

  $("#fb").scrollIntoView({
    behavior:"smooth",
    block:"start"
  });

}

function finish(){

  let score = Q.reduce(
    (a,q,n)=>a+(ans[n]===q.a),
    0
  );

  // 試験画面を隠す
  $("#exam").classList.add("hide");

  // 結果画面を表示
  $("#result").classList.remove("hide");

  // スコア表示
 $("#score").textContent =
RANDOM_MODE
 ? `総合ランダム ${score}/${Q.length}`
 : `第${ROUND+1}回 ${score}/${Q.length}`;

  // 復習一覧生成
  $("#reviews").innerHTML =

    Q.map((q,n)=>{

      const correct =
        ans[n]===q.a;

      return `

      <div class="feedback"
           style="
             margin-bottom:15px;
             background:${
               correct
                 ? '#dcfce7'
                 : '#fee2e2'
             };
           ">

        <h3>
          問${n+1}
          ${correct ? "○" : "×"}
        </h3>

        <p>
          <b>問題</b><br>
          ${q.p}
        </p>

        <p>
          <b>正答</b><br>
          ${q.c[q.a]}
        </p>

        <p>
          <b>全訳</b><br>
          ${q.jp}
        </p>

        <p>
          <b>解説</b><br>
          ${q.ex}
        </p>

      </div>

      `;

    }).join("");

}
$("#go").onclick = ()=>{

  if(!BANK[0].length){

    alert(
      "まだ問題が登録されていません。"
    );

    return;
  }

  load();

  $("#start").classList.add("hide");
  $("#exam").classList.remove("hide");

  render();

};

$("#prev").onclick = ()=>{
  if(i>0){
    i--;
    render();

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });
  }
};

$("#next").onclick = ()=>{
  if(i < Q.length - 1){
    i++;
    render();

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }else{
    finish();
  }
};

$("#home").onclick = ()=>{

  if(
    confirm("タイトル画面へ戻りますか？")
  ){
    location.reload();
  }

};
</script>
