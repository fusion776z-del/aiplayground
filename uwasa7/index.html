<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ウワサ撃退局 分岐版</title><link rel="stylesheet" href="style.css"></head><body><div id="app">
<header><h1>ウワサ撃退局</h1><span id="stageLabel"></span><span>自動保存</span></header>
<section id="title" class="screen active hero"><h2>ウワサの七不思議</h2><p>選んだ聞き方が、証言・ボス・結末を変える。</p><button id="newGame">最初から</button><button id="continueGame">続きから</button></section>
<section id="map" class="screen"><h2>事件ファイル</h2><div id="stageCards" class="cards"></div></section>
<section id="talk" class="screen"><div class="talkGrid"><aside><div id="speakerIcon" class="icon"></div><h2 id="speakerName"></h2><p id="mood"></p><div class="meters">信頼 <b id="trustN"></b><progress id="trust" max="100"></progress> 動揺 <b id="stressN"></b><progress id="stress" max="100"></progress></div></aside><main><div id="speech" class="paper speech"></div><div id="choices"></div><div class="notebook">証言：<span id="words"></span></div></main></div></section>
<section id="prep" class="screen"><h2>現場準備</h2><div class="prepGrid"><div class="paper"><h3>言葉を2つ選択</h3><div id="wordList"></div></div><div class="paper"><div id="slots">言葉A ＋ 言葉B</div><h2 id="bulletName">未生成</h2><p id="bulletDesc"></p><button id="deploy" disabled>出撃</button></div><div class="paper center"><div id="bossIcon" class="icon"></div><h3 id="bossName"></h3><p id="routeInfo"></p></div></div></section>
<section id="battle" class="screen"><div class="battleHud"><div>残り <b id="hpN">0</b><progress id="hp" max="100"></progress></div><div>回収 <b id="coreN">0</b><progress id="core" max="100"></progress></div><b id="rush"></b></div><canvas id="game" width="960" height="600"></canvas><div class="controls">移動 WASD/矢印｜回避 Space｜言葉の力 X｜<span id="life"></span></div><div id="overlay"><p id="overlayText"></p><button id="battleStart">調査開始</button></div></section>
<section id="result" class="screen result"><h2 id="resultTitle"></h2><div id="resultText" class="paper"></div><button id="next">事件ファイルへ</button></section>
</div><script src="scenarios.js"></script><script src="app.js"></script></body></html>
